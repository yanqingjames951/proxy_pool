apiVersion: v1
kind: Namespace
metadata:
  name: proxy-pool
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-pool-config
  namespace: proxy-pool
data:
  HOST: "0.0.0.0"
  PORT: "5010"
  DB_CONN: "redis://:@proxy-redis:6379/0"
  TABLE_NAME: "use_proxy"
  HTTP_URL: "http://httpbin.org"
  HTTPS_URL: "https://www.qq.com"
  VERIFY_TIMEOUT: "10"
  MAX_FAIL_COUNT: "5"
  POOL_SIZE_MIN: "50"
  AUTH_ENABLED: "True"
  RATE_LIMIT_ENABLED: "True"
  RATE_LIMIT_PER_MINUTE: "60"
  RATE_LIMIT_PER_DAY: "1000"
---
apiVersion: v1
kind: Secret
metadata:
  name: proxy-pool-secrets
  namespace: proxy-pool
type: Opaque
stringData:
  REDIS_PASSWORD: ""
  ALERT_WEBHOOK: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-redis
  namespace: proxy-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-redis
  template:
    metadata:
      labels:
        app: proxy-redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: proxy-pool
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-redis
  namespace: proxy-pool
spec:
  selector:
    app: proxy-redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-pool
  namespace: proxy-pool
spec:
  replicas: 2
  selector:
    matchLabels:
      app: proxy-pool
  template:
    metadata:
      labels:
        app: proxy-pool
    spec:
      containers:
      - name: proxy-pool
        image: proxy-pool:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5010
        envFrom:
        - configMapRef:
            name: proxy-pool-config
        - secretRef:
            name: proxy-pool-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/
            port: 5010
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/
            port: 5010
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-pool
  namespace: proxy-pool
spec:
  selector:
    app: proxy-pool
  ports:
  - port: 5010
    targetPort: 5010
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-ui
  namespace: proxy-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-ui
  template:
    metadata:
      labels:
        app: proxy-ui
    spec:
      containers:
      - name: proxy-ui
        image: proxy-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-ui
  namespace: proxy-pool
spec:
  selector:
    app: proxy-ui
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxy-pool-ingress
  namespace: proxy-pool
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: proxy.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: proxy-ui
            port:
              number: 80
      - path: /get
        pathType: Prefix
        backend:
          service:
            name: proxy-pool
            port:
              number: 5010
      - path: /pop
        pathType: Prefix
        backend:
          service:
            name: proxy-pool
            port:
              number: 5010
      - path: /all
        pathType: Prefix
        backend:
          service:
            name: proxy-pool
            port:
              number: 5010
      - path: /count
        pathType: Prefix
        backend:
          service:
            name: proxy-pool
            port:
              number: 5010
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: proxy-pool
            port:
              number: 5010
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: proxy-pool
            port:
              number: 5010
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: proxy-pool
            port:
              number: 5010
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: proxy-pool
            port:
              number: 5010
      - path: /export
        pathType: Prefix
        backend:
          service:
            name: proxy-pool
            port:
              number: 5010
      - path: /get_batch
        pathType: Prefix
        backend:
          service:
            name: proxy-pool
            port:
              number: 5010
      - path: /delete
        pathType: Prefix
        backend:
          service:
            name: proxy-pool
            port:
              number: 5010
