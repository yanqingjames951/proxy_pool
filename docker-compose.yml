services:
  proxy_pool:
    build: .
    container_name: proxy_pool
    # ports:
    #   - "5010:5010"  # Exposed via Nginx
    expose:
      - "5010"
    depends_on:
      - proxy_redis
    environment:
      DB_CONN: "redis://@proxy_redis:6379/0"
    restart: unless-stopped

  proxy_redis:
    image: "redis:alpine"
    container_name: proxy_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  proxy_ui:
    build: ./proxy-pool-ui
    container_name: proxy_ui
    # ports:
    #   - "5011:80"  # Exposed via Nginx
    expose:
      - "80"
    depends_on:
      - proxy_pool
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: proxy_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - proxy_pool
      - proxy_ui
    restart: unless-stopped

volumes:
  redis_data:
