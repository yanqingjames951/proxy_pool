server {
    listen 80;
    server_name proxy_pool.feiwindevelopment.com;

    # 前端 Dashboard
    location / {
        proxy_pass http://proxy_ui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后端 API
    # 转发 /api/ 开头的请求及其它根级 API 请求
    # 注意：前端直接调用的是 /count/, /delete/ 等，需要兼容
    # 为了简单，我们匹配常见 API 模式或直接 fallback
    
    location ~ ^/(api|count|delete|get|pop|all|refresh|metrics|health)/ {
        proxy_pass http://proxy_pool:5010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
