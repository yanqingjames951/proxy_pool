<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: #101822;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .settings-panel {
            width: 320px;
            background: #1c232e;
            border-radius: 12px;
            border: 1px solid #282f39;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #282f39;
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .close-btn {
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.15s;
        }

        .close-btn:hover {
            background: #282f39;
            color: #fff;
        }

        .close-btn .material-symbols-outlined {
            font-size: 20px;
        }

        /* Content */
        .content {
            padding: 20px;
        }

        /* Section */
        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .section-icon {
            width: 20px;
            height: 20px;
            background: #136dec;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .section-icon .material-symbols-outlined {
            font-size: 14px;
            color: #fff;
        }

        .section-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .form-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .optional-badge {
            font-size: 9px;
            font-weight: 500;
            color: #64748b;
            background: #282f39;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #334155;
        }

        /* Input Row */
        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
        }

        .input-field {
            width: 100%;
            padding: 10px 12px;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            background: #151a23;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: all 0.15s;
        }

        .input-field.has-icon {
            padding-left: 36px;
        }

        .input-field.has-status {
            padding-right: 36px;
        }

        .input-field::placeholder {
            color: #64748b;
        }

        .input-field:focus {
            border-color: #136dec;
            box-shadow: 0 0 0 2px rgba(19, 109, 236, 0.15);
        }

        .input-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 16px;
        }

        .input-status {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .input-status .material-symbols-outlined {
            font-size: 18px;
            color: #10b981;
        }

        .input-hint {
            font-size: 10px;
            color: #64748b;
            margin-top: 6px;
        }

        /* Small Button */
        .btn-small {
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            background: #282f39;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .btn-small:hover {
            background: #334155;
            color: #fff;
        }

        /* Toggle Password */
        .toggle-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 0;
            display: flex;
        }

        .toggle-btn:hover {
            color: #94a3b8;
        }

        .toggle-btn .material-symbols-outlined {
            font-size: 18px;
        }

        /* Footer */
        .footer {
            display: flex;
            gap: 10px;
            padding: 0 20px 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-secondary {
            flex: 1;
            background: #282f39;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #334155;
        }

        .btn-primary {
            flex: 1.5;
            background: #136dec;
            color: #fff;
        }

        .btn-primary:hover {
            background: #1159c7;
        }

        .btn .material-symbols-outlined {
            font-size: 16px;
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            z-index: 100;
            animation: slideUp 0.3s ease-out;
        }

        .notification.success {
            background: #10b981;
            color: #fff;
        }

        .notification.error {
            background: #f43f5e;
            color: #fff;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>

<body>
    <div class="settings-panel">
        <!-- Header -->
        <div class="header">
            <span class="header-title">Settings</span>
            <button id="closeBtn" class="close-btn">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Section Header -->
            <div class="section-header">
                <div class="section-icon">
                    <span class="material-symbols-outlined">dns</span>
                </div>
                <span class="section-title">Backend API Configuration</span>
            </div>

            <!-- Online Interface Address -->
            <div class="form-group">
                <label class="form-label">Online Interface Address</label>
                <div class="input-wrapper">
                    <input id="apiEndpoint" type="text" class="input-field has-status"
                        placeholder="https://api.example.com" value="https://proxy_pool.feiwindevelopment.com" />
                    <span id="endpointStatus" class="input-status">
                        <span class="material-symbols-outlined">check_circle</span>
                    </span>
                </div>
                <p class="input-hint">Primary endpoint for cloud proxy connections.</p>
            </div>

            <!-- API Key / Local Interface -->
            <div class="form-group">
                <div class="form-label-row">
                    <label class="form-label" style="margin-bottom: 0;">API Key</label>
                    <span class="optional-badge">Required</span>
                </div>
                <div class="input-row">
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">key</span>
                        <input id="apiKey" type="password" class="input-field has-icon" placeholder="Enter your API key"
                            style="font-family: 'Monaco', 'Consolas', monospace; font-size: 11px;" />
                        <button id="togglePassword" class="toggle-btn" style="right: 10px;">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                    <button id="testBtn" class="btn-small">Test</button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
            <button id="saveBtn" class="btn btn-primary">
                <span class="material-symbols-outlined">save</span>
                Save Configuration
            </button>
        </div>
    </div>

    <script src="settings.js"></script>
</body>

</html>
