<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Proxy Pool</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      height: 500px;
      font-family: 'Inter', sans-serif;
      background: #101822;
      color: #fff;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #1c232e;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #282f39;
      background: rgba(28, 35, 46, 0.9);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #136dec;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 4px 12px rgba(19, 109, 236, 0.3);
    }

    .logo .material-symbols-outlined {
      font-size: 18px;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .header-buttons {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .icon-btn:hover {
      background: #1e293b;
    }

    .icon-btn .material-symbols-outlined {
      font-size: 20px;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: #151a23;
      border-bottom: 1px solid #282f39;
      font-size: 11px;
    }

    .stats-left {
      display: flex;
      gap: 16px;
      color: #94a3b8;
    }

    .stats-left strong {
      color: #fff;
    }

    .stats-left .http {
      color: #34d399;
    }

    .stats-left .https {
      color: #60a5fa;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    .search-bar {
      padding: 8px 12px;
      border-bottom: 1px solid #282f39;
      background: rgba(28, 35, 46, 0.5);
    }

    .search-input-wrapper {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 18px;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      background: #151a23;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search-input::placeholder {
      color: #64748b;
    }

    .search-input:focus {
      border-color: #136dec;
      box-shadow: 0 0 0 2px rgba(19, 109, 236, 0.2);
    }

    .proxy-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .proxy-list::-webkit-scrollbar {
      width: 4px;
    }

    .proxy-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .proxy-list::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }

    .state-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #64748b;
      text-align: center;
    }

    .state-container .material-symbols-outlined {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .state-container .text {
      font-size: 13px;
    }

    .state-container .btn {
      margin-top: 16px;
      padding: 10px 20px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .state-container .btn-primary {
      background: #136dec;
      color: #fff;
    }

    .state-container .btn-primary:hover {
      background: #1159c7;
    }

    .hidden {
      display: none !important;
    }

    .proxy-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }

    .proxy-item:hover {
      background: rgba(28, 35, 46, 0.8);
      border-color: #334155;
    }

    .proxy-item.selected {
      background: #1c232e;
      border-color: rgba(19, 109, 236, 0.5);
      box-shadow: 0 0 0 1px rgba(19, 109, 236, 0.2);
    }

    .proxy-flag {
      font-size: 24px;
    }

    .proxy-info {
      flex: 1;
      min-width: 0;
    }

    .proxy-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .proxy-region {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .proxy-latency {
      font-size: 11px;
      font-weight: 700;
    }

    .latency-fast {
      color: #10b981;
    }

    .latency-medium {
      color: #f59e0b;
    }

    .latency-slow {
      color: #f43f5e;
    }

    .proxy-details {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .proxy-ip {
      font-size: 11px;
      font-family: 'Monaco', 'Consolas', monospace;
      color: #94a3b8;
    }

    .proxy-protocol {
      font-size: 9px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .protocol-http {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    .protocol-https {
      background: rgba(96, 165, 250, 0.15);
      color: #60a5fa;
    }

    .speed-bar {
      display: flex;
      gap: 2px;
      align-items: flex-end;
      height: 10px;
      margin-left: auto;
    }

    .speed-bar .bar {
      width: 3px;
      border-radius: 1px;
    }

    .speed-bar .bar-1 {
      height: 4px;
    }

    .speed-bar .bar-2 {
      height: 7px;
    }

    .speed-bar .bar-3 {
      height: 10px;
    }

    .bar-active-fast {
      background: #10b981;
    }

    .bar-active-medium {
      background: #f59e0b;
    }

    .bar-active-slow {
      background: #f43f5e;
    }

    .bar-inactive {
      background: #374151;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: #151a23;
      border-top: 1px solid #282f39;
      font-size: 10px;
      color: #64748b;
    }

    .footer .online {
      color: #34d399;
    }

    .footer .offline {
      color: #f43f5e;
    }

    .notification {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: #136dec;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      z-index: 100;
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .animate-spin {
      animation: spin 1s linear infinite;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <span class="material-symbols-outlined">shield</span>
        </div>
        <span class="title">Proxy Pool</span>
      </div>
      <div class="header-buttons">
        <button id="refreshBtn" class="icon-btn" title="Refresh">
          <span class="material-symbols-outlined">refresh</span>
        </button>
        <button id="settingsBtn" class="icon-btn" title="Settings">
          <span class="material-symbols-outlined">settings</span>
        </button>
      </div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stats-left">
        <span>Total: <strong id="totalCount">-</strong></span>
        <span>HTTP: <strong id="httpCount" class="http">-</strong></span>
        <span>HTTPS: <strong id="httpsCount" class="https">-</strong></span>
      </div>
      <div class="status">
        <div class="status-dot"></div>
        <span>Connected</span>
      </div>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <div class="search-input-wrapper">
        <span class="material-symbols-outlined search-icon">search</span>
        <input id="searchInput" class="search-input" placeholder="Search IP or region..." type="text" />
      </div>
    </div>

    <!-- Proxy List -->
    <div id="proxyList" class="proxy-list">
      <!-- Loading State -->
      <div id="loadingState" class="state-container">
        <span class="material-symbols-outlined animate-spin">progress_activity</span>
        <span class="text">Loading proxies...</span>
      </div>
      <!-- Empty State -->
      <div id="emptyState" class="state-container hidden">
        <span class="material-symbols-outlined">cloud_off</span>
        <span class="text">No proxies available</span>
        <button id="configureBtn" class="btn btn-primary">Configure API</button>
      </div>
      <!-- Error State -->
      <div id="errorState" class="state-container hidden">
        <span class="material-symbols-outlined" style="color: #f43f5e;">error</span>
        <span class="text" id="errorMessage" style="color: #fb7185;">Connection failed</span>
        <button id="retryBtn" class="btn btn-primary" style="background: #475569;">Retry</button>
      </div>
      <!-- Proxy Items will be inserted here -->
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>API: <strong id="apiStatus" class="online">Online</strong></span>
      <span id="lastUpdate">Updated just now</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
